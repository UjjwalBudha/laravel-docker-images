; Mitigation for CVE-2026-109618 / CVE-2026-109619 ("php2shell"), a pre-auth RCE
; reachable on any multipart POST endpoint under default configuration.
;
; Shipped only in the PHP 7.4 / 8.0 / 8.1 images. Those branches are EOL and
; will never receive the upstream fix, so disabling the vulnerable feature is
; the only available remedy. Supported branches (8.2+) carry the real patch and
; deliberately do not include this file.
;
; The `zzz-` prefix makes this load after a downstream project's own conf.d
; drop-ins, so an app cannot re-enable the feature by accident.
session.upload_progress.enabled = Off
